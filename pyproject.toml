[project]
name = "trellis-contracts"
version = "0.2.0"
description = "The types an agent must accept and return. No runtime, no transport, no I/O."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``trellis`` is a namespace package shared by every trellis-* distribution: no __init__.py.
packages = ["src/trellis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
